name: Deploy

# Push to main -> build here -> ship the built files to the server -> verify.
#
# The site is built once, on the runner, and the resulting directory is what
# gets shipped. The server never fetches from GitHub and never runs a build,
# so the bytes verified in CI are exactly the bytes served, and a GitHub
# outage cannot strand a deploy halfway through.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # redeploy by hand from the Actions tab

# Never let two deploys race each other onto the same box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Check the build produced what we expect
        run: |
          set -euo pipefail
          test -s build/index.html
          test -s build/Arash-Nikbakht-CV.pdf
          ls build/assets/index-*.js >/dev/null

          # Every asset the page references must actually exist in the build.
          # index.html names only the entry css/js; hashed images are referenced
          # from inside the bundle, so both get scanned.
          # A typo'd path or a file that silently failed to copy would
          # otherwise only show up as a 404 in production.
          missing=0
          for rel in $(grep -ohE 'assets/[A-Za-z0-9@._-]+\.(js|css|jpg|jpeg|png|svg|webp|woff2)' build/index.html build/assets/*.js 2>/dev/null | sort -u); do
            if [ ! -f "build/$rel" ]; then echo "::error::referenced but missing: $rel"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

          echo "build ok: $(find build -type f | wc -l) files"

      # Hand the exact built directory to the deploy job rather than
      # rebuilding it there.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build
    # Pull requests get the build check only; deploys are for main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anikbakht.com
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: build

      # Host and port are secrets, not vars: this repo is public, and the
      # public hostnames sit behind Cloudflare. Committing the origin address
      # would let anyone skip the proxy and hit the box directly.
      - name: Set up the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          missing=
          [ -n "$DEPLOY_KEY" ]  || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$DEPLOY_HOST" ] || missing="$missing SERVER_IP"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing - see README deploy notes"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Fail here, with a clear message, rather than inside a tar pipe.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -p "$DEPLOY_PORT" "${{ secrets.SSH_USER || 'root' }}@$DEPLOY_HOST" \
              'echo "ssh ok: $(hostname)"' \
            || { echo "::error::cannot SSH to the server - check SERVER_IP/SSH_PORT and that the public key is in authorized_keys"; exit 1; }

      - name: Upload the build to the server
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/root/anikbakht.ir' }}
        run: |
          set -euo pipefail
          # Streamed as a tarball so the whole release lands in one connection
          # and needs nothing installed on the server beyond tar.
          tar czf - -C build . | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$APP_DIR'; rm -rf build.new; mkdir -p build.new; tar xzf - -C build.new"

      - name: Activate and verify
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/root/anikbakht.ir' }}
        run: |
          set -euo pipefail
          # Piped over stdin so the server always runs the activation logic
          # from the commit being deployed - nothing to keep in sync.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o ConnectTimeout=20 -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "APP_DIR='$APP_DIR' RELEASE='${{ github.sha }}' bash -s" < scripts/activate.sh

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
