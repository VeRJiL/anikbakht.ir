name: Deploy

# Every push to main is built here first. Only if that build succeeds do we
# touch the server, so a compile error can never reach production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

# Never let two deploys race each other onto the same box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - name: Check the build produced what we expect
        run: |
          test -s build/index.html
          test -s build/Arash-Nikbakht-CV.pdf
          ls build/assets/index-*.js >/dev/null
          echo "build ok: $(find build -type f | wc -l) files"

  deploy:
    name: Deploy to production
    needs: build
    # Pull requests get the build check only; deploys are for main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anikbakht.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'japs.ir' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Pipe the script in over stdin so the server always runs the deploy
          # logic from the commit being deployed - nothing to keep in sync.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/deploy.sh

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
